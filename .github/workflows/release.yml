name: Release

# Push a tag like v0.1.0 (matching versionName in app/build.gradle.kts) to
# build signed APKs and attach them to a *draft* GitHub Release. A draft is
# visible only to people with write access to the repository, so the APKs are
# not public: open the Releases page while signed in to download them.
# To share a build publicly later, press "Publish release" on the draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.YTDLM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret YTDLM_KEYSTORE_BASE64 is missing (see README > Signing)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "YTDLM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release APKs
        env:
          YTDLM_KEYSTORE_PASSWORD: ${{ secrets.YTDLM_KEYSTORE_PASSWORD }}
          YTDLM_KEY_ALIAS: ${{ secrets.YTDLM_KEY_ALIAS }}
          YTDLM_KEY_PASSWORD: ${{ secrets.YTDLM_KEY_PASSWORD }}
        # AGP 9 only creates unit-test tasks for the tested (debug) build
        # type; the tests are pure Kotlin, so they cover release too.
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name, verify and checksum the APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            cp "$f" "dist/YTDLManager-$VERSION-$abi.apk"
          done
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for f in dist/*.apk; do "$APKSIGNER" verify --print-certs "$f" | head -4; done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Which file?** Almost every phone from the last ~8 years: `YTDLManager-${{ env.VERSION }}-arm64-v8a.apk`.
            Older 32-bit phones: `armeabi-v7a`. Emulators and Chromebooks: `x86_64`. Not sure: `universal` (bigger, works everywhere).

            Install: open the APK on your phone and allow "Install unknown apps" for your browser or file manager when Android asks.
            See the README for step-by-step instructions. Requires Android 10 or newer.

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
